services:
  web:
    build:
      context: .
      args:
        NEXT_BASE_PATH: ${NEXT_BASE_PATH:-}
    image: mr-pushkin-league-web:latest
    container_name: mr-pushkin-league-web
    restart: unless-stopped
    # Host network so Next rewrites to 127.0.0.1:3020 reach the Go API on the Pi
    # (nginx still has no /api/ location until configure-pi-nginx.sh is re-run with sudo).
    network_mode: host
    environment:
      NODE_ENV: production
      TZ: Europe/Moscow
      PORT: "3010"
      HOSTNAME: "127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010${NEXT_BASE_PATH:-}/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
